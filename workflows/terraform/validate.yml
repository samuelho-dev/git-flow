name: 'Terraform Validate'

on:
  workflow_call:
    inputs:
      terraform-path:
        description: 'Path to Terraform directory'
        required: true
        type: string
      terraform-version:
        description: 'Terraform version'
        required: false
        type: string
        default: '1.9.8'
      format-check:
        description: 'Check Terraform formatting'
        required: false
        type: boolean
        default: true
      tfsec-scan:
        description: 'Run tfsec security scan'
        required: false
        type: boolean
        default: true
      checkov-scan:
        description: 'Run Checkov compliance scan'
        required: false
        type: boolean
        default: true
      terraform-docs-check:
        description: 'Check if README.md is up to date'
        required: false
        type: boolean
        default: false
      upload-sarif:
        description: 'Upload security scan results to GitHub Security'
        required: false
        type: boolean
        default: true
      working-directory:
        description: 'Working directory for commands'
        required: false
        type: string
        default: '.'
    outputs:
      validation-result:
        description: 'Validation result (success/failure)'
        value: ${{ jobs.validate.outputs.result }}
      format-result:
        description: 'Format check result'
        value: ${{ jobs.validate.outputs.format-result }}
      security-findings:
        description: 'Number of security findings'
        value: ${{ jobs.validate.outputs.findings }}

permissions:
  contents: read
  security-events: write

jobs:
  validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      result: ${{ steps.validate.outcome }}
      format-result: ${{ steps.fmt.outcome }}
      findings: ${{ steps.count-findings.outputs.total }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ inputs.terraform-version }}

      - name: Get Terraform info
        id: info
        working-directory: ${{ inputs.working-directory }}/${{ inputs.terraform-path }}
        run: |
          terraform version
          echo "Terraform directory: ${{ inputs.terraform-path }}"

          # Count .tf files
          TF_FILES=$(find . -name "*.tf" | wc -l)
          echo "tf-files=$TF_FILES" >> $GITHUB_OUTPUT
          echo "Found $TF_FILES Terraform files"

      - name: Terraform Format Check
        if: inputs.format-check
        id: fmt
        working-directory: ${{ inputs.working-directory }}/${{ inputs.terraform-path }}
        continue-on-error: true
        run: |
          echo "Checking Terraform formatting..."
          terraform fmt -check -recursive -diff

      - name: Terraform Init
        working-directory: ${{ inputs.working-directory }}/${{ inputs.terraform-path }}
        run: |
          echo "Initializing Terraform..."
          terraform init -backend=false

      - name: Terraform Validate
        id: validate
        working-directory: ${{ inputs.working-directory }}/${{ inputs.terraform-path }}
        run: |
          echo "Validating Terraform configuration..."
          terraform validate -no-color

      - name: Install tfsec
        if: inputs.tfsec-scan
        run: |
          TFSEC_VERSION="v1.28.11"
          wget -q "https://github.com/aquasecurity/tfsec/releases/download/${TFSEC_VERSION}/tfsec_${TFSEC_VERSION#v}_linux_amd64.tar.gz"
          tar -xzf "tfsec_${TFSEC_VERSION#v}_linux_amd64.tar.gz"
          sudo mv tfsec /usr/local/bin/
          tfsec --version

      - name: Run tfsec scan
        if: inputs.tfsec-scan
        working-directory: ${{ inputs.working-directory }}/${{ inputs.terraform-path }}
        continue-on-error: true
        run: |
          echo "Running tfsec security scan..."
          tfsec . \
            --format sarif \
            --out tfsec-results.sarif \
            --soft-fail

      - name: Install Checkov
        if: inputs.checkov-scan
        run: |
          pip3 install --upgrade pip setuptools
          pip3 install checkov==3.2.291

      - name: Run Checkov scan
        if: inputs.checkov-scan
        working-directory: ${{ inputs.working-directory }}/${{ inputs.terraform-path }}
        continue-on-error: true
        run: |
          echo "Running Checkov compliance scan..."
          checkov -d . \
            --output sarif \
            --output-file-path . \
            --download-external-modules true \
            --quiet

      - name: Upload tfsec results to GitHub Security
        if: inputs.tfsec-scan && inputs.upload-sarif
        uses: github/codeql-action/upload-sarif@48ab28a6f5dbc2a99bf1e0131198dd8f1df78169 # v3.28.0
        with:
          sarif_file: ${{ inputs.working-directory }}/${{ inputs.terraform-path }}/tfsec-results.sarif
          category: 'tfsec'

      - name: Upload Checkov results to GitHub Security
        if: inputs.checkov-scan && inputs.upload-sarif
        uses: github/codeql-action/upload-sarif@48ab28a6f5dbc2a99bf1e0131198dd8f1df78169 # v3.28.0
        with:
          sarif_file: ${{ inputs.working-directory }}/${{ inputs.terraform-path }}/results_sarif.sarif
          category: 'checkov'

      - name: Count security findings
        if: always()
        id: count-findings
        working-directory: ${{ inputs.working-directory }}/${{ inputs.terraform-path }}
        run: |
          TOTAL=0

          if [ -f "tfsec-results.sarif" ]; then
            TFSEC_FINDINGS=$(jq '.runs[0].results | length' tfsec-results.sarif 2>/dev/null || echo "0")
            echo "tfsec findings: $TFSEC_FINDINGS"
            TOTAL=$((TOTAL + TFSEC_FINDINGS))
          fi

          if [ -f "results_sarif.sarif" ]; then
            CHECKOV_FINDINGS=$(jq '.runs[0].results | length' results_sarif.sarif 2>/dev/null || echo "0")
            echo "Checkov findings: $CHECKOV_FINDINGS"
            TOTAL=$((TOTAL + CHECKOV_FINDINGS))
          fi

          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "Total security findings: $TOTAL"

      - name: Install terraform-docs
        if: inputs.terraform-docs-check
        run: |
          TFDOCS_VERSION="v0.19.0"
          wget -q "https://github.com/terraform-docs/terraform-docs/releases/download/${TFDOCS_VERSION}/terraform-docs-${TFDOCS_VERSION}-linux-amd64.tar.gz"
          tar -xzf "terraform-docs-${TFDOCS_VERSION}-linux-amd64.tar.gz"
          sudo mv terraform-docs /usr/local/bin/
          terraform-docs --version

      - name: Check terraform-docs
        if: inputs.terraform-docs-check
        working-directory: ${{ inputs.working-directory }}/${{ inputs.terraform-path }}
        run: |
          echo "Checking if README.md is up to date..."
          terraform-docs markdown . --output-file README.md --output-mode inject

          if git diff --exit-code README.md; then
            echo "✅ README.md is up to date"
          else
            echo "❌ README.md is out of date. Run 'terraform-docs markdown . --output-file README.md --output-mode inject' to update."
            exit 1
          fi

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: terraform-validation-results
          path: |
            ${{ inputs.working-directory }}/${{ inputs.terraform-path }}/tfsec-results.sarif
            ${{ inputs.working-directory }}/${{ inputs.terraform-path }}/results_sarif.sarif
          retention-days: 30

      - name: Generate validation summary
        if: always()
        working-directory: ${{ inputs.working-directory }}/${{ inputs.terraform-path }}
        run: |
          {
            echo "## 🏗️  Terraform Validation Summary"
            echo ""
            echo "**Terraform Path:** \`${{ inputs.terraform-path }}\`"
            echo "**Terraform Version:** \`${{ inputs.terraform-version }}\`"
            echo "**Terraform Files:** ${{ steps.info.outputs.tf-files }}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # Validation result
          if [ "${{ steps.validate.outcome }}" == "success" ]; then
            echo "✅ **Terraform Validate: Passed**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ **Terraform Validate: Failed**" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Format check result
          if [ "${{ inputs.format-check }}" == "true" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            if [ "${{ steps.fmt.outcome }}" == "success" ]; then
              echo "✅ **Format Check: Passed**" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "❌ **Format Check: Failed** - Run \`terraform fmt -recursive\` to fix" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          # Security findings
          if [ "${{ inputs.tfsec-scan }}" == "true" ] || [ "${{ inputs.checkov-scan }}" == "true" ]; then
            TOTAL_FINDINGS=${{ steps.count-findings.outputs.total }}
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Security Scan Results" >> "$GITHUB_STEP_SUMMARY"

            if [ "$TOTAL_FINDINGS" -eq 0 ]; then
              echo "✅ **No security issues found**" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "⚠️  **Found $TOTAL_FINDINGS security findings**" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "Review the Security tab for detailed findings." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          # terraform-docs result
          if [ "${{ inputs.terraform-docs-check }}" == "true" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "✅ **README.md is up to date**" >> "$GITHUB_STEP_SUMMARY"
          fi
