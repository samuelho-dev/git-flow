name: 'Terraform Apply'

on:
  workflow_call:
    inputs:
      terraform-path:
        description: 'Path to Terraform directory'
        required: true
        type: string
      terraform-version:
        description: 'Terraform version'
        required: false
        type: string
        default: '1.9.8'
      plan-artifact-name:
        description: 'Name of plan artifact to apply (e.g., terraform-plan-{sha})'
        required: false
        type: string
        default: ''
      apply-args:
        description: 'Additional arguments for terraform apply'
        required: false
        type: string
        default: ''
      working-directory:
        description: 'Working directory for commands'
        required: false
        type: string
        default: '.'
      environment:
        description: 'GitHub environment for approval (production, staging, etc.)'
        required: false
        type: string
        default: ''
      backup-state:
        description: 'Backup state file before apply'
        required: false
        type: boolean
        default: true
      skip-plan:
        description: 'Skip plan validation (NOT RECOMMENDED)'
        required: false
        type: boolean
        default: false
    secrets:
      terraform-token:
        description: 'Terraform Cloud/Enterprise API token'
        required: false
      aws-access-key-id:
        description: 'AWS Access Key ID (if using AWS)'
        required: false
      aws-secret-access-key:
        description: 'AWS Secret Access Key (if using AWS)'
        required: false
    outputs:
      apply-result:
        description: 'Apply result (success/failure)'
        value: ${{ jobs.apply.outputs.result }}
      resources-applied:
        description: 'Number of resources applied'
        value: ${{ jobs.apply.outputs.resources-applied }}

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    outputs:
      result: ${{ steps.apply.outcome }}
      resources-applied: ${{ steps.parse-apply.outputs.resources-applied }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ inputs.terraform-version }}
          cli_config_credentials_token: ${{ secrets.terraform-token }}

      - name: Configure AWS Credentials
        if: secrets.aws-access-key-id != ''
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          aws-access-key-id: ${{ secrets.aws-access-key-id }}
          aws-secret-access-key: ${{ secrets.aws-secret-access-key }}
          aws-region: us-east-1

      - name: Terraform Init
        working-directory: ${{ inputs.working-directory }}/${{ inputs.terraform-path }}
        run: |
          echo "Initializing Terraform..."
          terraform init

      - name: Download plan artifact
        if: inputs.plan-artifact-name != ''
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ${{ inputs.plan-artifact-name }}
          path: ${{ inputs.working-directory }}/${{ inputs.terraform-path }}

      - name: Validate plan file
        if: inputs.plan-artifact-name != '' && !inputs.skip-plan
        working-directory: ${{ inputs.working-directory }}/${{ inputs.terraform-path }}
        run: |
          if [ ! -f "tfplan" ]; then
            echo "❌ Plan file not found in artifact!"
            echo "Expected file: tfplan"
            echo "Artifact name: ${{ inputs.plan-artifact-name }}"
            exit 1
          fi

          echo "✅ Plan file found, validating..."
          terraform show tfplan > /dev/null

      - name: Generate new plan (if no artifact provided)
        if: inputs.plan-artifact-name == '' || inputs.skip-plan
        working-directory: ${{ inputs.working-directory }}/${{ inputs.terraform-path }}
        run: |
          echo "⚠️  No plan artifact provided, generating new plan..."
          terraform plan -out=tfplan ${{ inputs.apply-args }}

      - name: Display plan summary
        working-directory: ${{ inputs.working-directory }}/${{ inputs.terraform-path }}
        run: |
          echo "📋 Plan Summary:"
          terraform show -no-color tfplan | grep -E "(Plan:|No changes)" || true

      - name: Backup state file
        if: inputs.backup-state
        working-directory: ${{ inputs.working-directory }}/${{ inputs.terraform-path }}
        run: |
          echo "Creating state backup..."
          if terraform state pull > terraform.tfstate.backup 2>/dev/null; then
            BACKUP_SIZE=$(wc -c < terraform.tfstate.backup)
            if [ "$BACKUP_SIZE" -gt 0 ]; then
              echo "✅ State backup created ($BACKUP_SIZE bytes)"
            else
              echo "⚠️  State file is empty or doesn't exist yet"
            fi
          else
            echo "⚠️  Could not create state backup (may be first apply)"
          fi

      - name: Terraform Apply
        id: apply
        working-directory: ${{ inputs.working-directory }}/${{ inputs.terraform-path }}
        run: |
          echo "Applying Terraform changes..."
          terraform apply -no-color -auto-approve tfplan | tee apply-output.txt

      - name: Parse apply output
        if: always()
        id: parse-apply
        working-directory: ${{ inputs.working-directory }}/${{ inputs.terraform-path }}
        run: |
          if [ -f "apply-output.txt" ]; then
            # Count applied resources
            RESOURCES_APPLIED=$(grep -oP 'Apply complete! Resources: \K\d+(?= added)' apply-output.txt || echo "0")
            echo "resources-applied=$RESOURCES_APPLIED" >> $GITHUB_OUTPUT
            echo "Resources applied: $RESOURCES_APPLIED"

            # Extract resource details
            ADDED=$(grep -oP 'Resources: \K\d+(?= added)' apply-output.txt || echo "0")
            CHANGED=$(grep -oP 'added, \K\d+(?= changed)' apply-output.txt || echo "0")
            DESTROYED=$(grep -oP 'changed, \K\d+(?= destroyed)' apply-output.txt || echo "0")

            echo "added=$ADDED" >> $GITHUB_OUTPUT
            echo "changed=$CHANGED" >> $GITHUB_OUTPUT
            echo "destroyed=$DESTROYED" >> $GITHUB_OUTPUT
          else
            echo "resources-applied=0" >> $GITHUB_OUTPUT
            echo "added=0" >> $GITHUB_OUTPUT
            echo "changed=0" >> $GITHUB_OUTPUT
            echo "destroyed=0" >> $GITHUB_OUTPUT
          fi

      - name: Upload apply artifacts
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: terraform-apply-${{ github.sha }}
          path: |
            ${{ inputs.working-directory }}/${{ inputs.terraform-path }}/apply-output.txt
            ${{ inputs.working-directory }}/${{ inputs.terraform-path }}/terraform.tfstate.backup
          retention-days: 90

      - name: Generate apply summary
        if: always()
        working-directory: ${{ inputs.working-directory }}/${{ inputs.terraform-path }}
        run: |
          {
            echo "## 🚀 Terraform Apply Summary"
            echo ""
            echo "**Terraform Path:** \`${{ inputs.terraform-path }}\`"
            echo "**Terraform Version:** \`${{ inputs.terraform-version }}\`"
            echo "**Environment:** \`${{ inputs.environment || 'default' }}\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.apply.outcome }}" == "success" ]; then
            echo "✅ **Apply Status: Success**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Resource Changes Applied" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Action | Count |" >> "$GITHUB_STEP_SUMMARY"
            echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
            echo "| 🟢 Added | ${{ steps.parse-apply.outputs.added }} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| 🟡 Changed | ${{ steps.parse-apply.outputs.changed }} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| 🔴 Destroyed | ${{ steps.parse-apply.outputs.destroyed }} |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ **Apply Status: Failed**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️  Infrastructure changes were not applied successfully." >> "$GITHUB_STEP_SUMMARY"

            if [ "${{ inputs.backup-state }}" == "true" ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "📦 **State backup available in artifacts: terraform-apply-${{ github.sha }}**" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          if [ "${{ inputs.backup-state }}" == "true" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "✅ **State backup created and uploaded**" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          echo "*Applied on $(date -u '+%Y-%m-%d %H:%M:%S UTC')*" >> "$GITHUB_STEP_SUMMARY"

      - name: Post-apply validation
        if: steps.apply.outcome == 'success'
        working-directory: ${{ inputs.working-directory }}/${{ inputs.terraform-path }}
        run: |
          echo "Running post-apply validation..."
          terraform validate
          echo "✅ Configuration is still valid after apply"
