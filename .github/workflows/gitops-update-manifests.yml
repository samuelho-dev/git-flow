name: 'GitOps Update Manifests'

on:
  workflow_call:
    inputs:
      manifest-path:
        description: 'Path to manifests directory'
        required: true
        type: string
      update-type:
        description: 'Update type (image, helm-values, kustomize)'
        required: false
        type: string
        default: 'image'
      image-name:
        description: 'Image name to update (for image type)'
        required: false
        type: string
        default: ''
      image-tag:
        description: 'New image tag'
        required: false
        type: string
        default: ''
      file-pattern:
        description: 'File pattern to update (glob)'
        required: false
        type: string
        default: '**/*.yaml'
      helm-key:
        description: 'Helm value key path (e.g., image.tag)'
        required: false
        type: string
        default: ''
      helm-value:
        description: 'Helm value to set'
        required: false
        type: string
        default: ''
      commit-message:
        description: 'Git commit message'
        required: false
        type: string
        default: ''
      create-pr:
        description: 'Create pull request instead of direct commit'
        required: false
        type: boolean
        default: false
      pr-branch:
        description: 'Branch name for PR'
        required: false
        type: string
        default: 'gitops/auto-update'
      target-branch:
        description: 'Target branch for updates'
        required: false
        type: string
        default: 'main'
    outputs:
      update-result:
        description: 'Update result (success/failure)'
        value: ${{ jobs.update.outputs.result }}
      files-updated:
        description: 'Number of files updated'
        value: ${{ jobs.update.outputs.files-updated }}
      pr-url:
        description: 'Pull request URL (if created)'
        value: ${{ jobs.update.outputs.pr-url }}

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Update Manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      result: ${{ steps.update.outcome }}
      files-updated: ${{ steps.count-changes.outputs.count }}
      pr-url: ${{ steps.create-pr.outputs.pr-url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install yq
        run: |
          YQ_VERSION="v4.44.6"
          wget -q "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" -O /tmp/yq
          sudo mv /tmp/yq /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Setup git config
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create PR branch
        if: inputs.create-pr
        run: |
          git checkout -b ${{ inputs.pr-branch }} || git checkout ${{ inputs.pr-branch }}
          git pull origin ${{ inputs.target-branch }} --rebase || true

      - name: Update image tags
        if: inputs.update-type == 'image'
        id: update
        working-directory: ${{ inputs.manifest-path }}
        run: |
          echo "Updating image: ${{ inputs.image-name }} to tag: ${{ inputs.image-tag }}"

          FILES_UPDATED=0

          # Find and update files matching pattern
          find . -name "${{ inputs.file-pattern }}" -type f | while read -r file; do
            echo "Processing: $file"

            # Update image tag using yq
            if yq eval '.spec.template.spec.containers[].image' "$file" 2>/dev/null | grep -q "${{ inputs.image-name }}"; then
              echo "Updating image in: $file"
              yq eval '(.spec.template.spec.containers[] | select(.image | contains("${{ inputs.image-name }}")) | .image) = "${{ inputs.image-name }}:${{ inputs.image-tag }}"' -i "$file"
              FILES_UPDATED=$((FILES_UPDATED + 1))
            fi

            # Also check for direct image fields
            if yq eval '.image' "$file" 2>/dev/null | grep -q "${{ inputs.image-name }}"; then
              echo "Updating direct image field in: $file"
              yq eval '.image = "${{ inputs.image-name }}:${{ inputs.image-tag }}"' -i "$file"
              FILES_UPDATED=$((FILES_UPDATED + 1))
            fi
          done

          echo "Updated $FILES_UPDATED files"

      - name: Update Helm values
        if: inputs.update-type == 'helm-values'
        id: update-helm
        working-directory: ${{ inputs.manifest-path }}
        run: |
          echo "Updating Helm value: ${{ inputs.helm-key }} = ${{ inputs.helm-value }}"

          FILES_UPDATED=0

          # Find values files
          find . -name "values*.yaml" -type f | while read -r file; do
            echo "Processing: $file"

            # Update using yq
            if yq eval ".${{ inputs.helm-key }}" "$file" 2>/dev/null > /dev/null; then
              echo "Updating ${{ inputs.helm-key }} in: $file"
              yq eval ".${{ inputs.helm-key }} = \"${{ inputs.helm-value }}\"" -i "$file"
              FILES_UPDATED=$((FILES_UPDATED + 1))
            fi
          done

          echo "Updated $FILES_UPDATED files"

      - name: Update Kustomize images
        if: inputs.update-type == 'kustomize'
        working-directory: ${{ inputs.manifest-path }}
        run: |
          echo "Updating Kustomize image: ${{ inputs.image-name }} to tag: ${{ inputs.image-tag }}"

          # Find kustomization files
          find . -name "kustomization.yaml" -type f | while read -r file; do
            echo "Processing: $file"
            cd "$(dirname "$file")"

            # Use kustomize edit to update image
            if command -v kustomize >/dev/null 2>&1; then
              kustomize edit set image "${{ inputs.image-name }}=${{ inputs.image-name }}:${{ inputs.image-tag }}"
            else
              echo "⚠️  kustomize not installed, using yq"
              yq eval '(.images[] | select(.name == "${{ inputs.image-name }}") | .newTag) = "${{ inputs.image-tag }}"' -i kustomization.yaml
            fi
          done

      - name: Count changed files
        id: count-changes
        run: |
          CHANGED_FILES=$(git diff --name-only | wc -l)
          echo "count=$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "Changed files: $CHANGED_FILES"

          if [ "$CHANGED_FILES" -eq 0 ]; then
            echo "⚠️  No changes detected"
          else
            echo "📝 Changed files:"
            git diff --name-only
          fi

      - name: Generate commit message
        id: commit-msg
        run: |
          if [ -n "${{ inputs.commit-message }}" ]; then
            MSG="${{ inputs.commit-message }}"
          else
            case "${{ inputs.update-type }}" in
              image)
                MSG="chore(gitops): update ${{ inputs.image-name }} to ${{ inputs.image-tag }}"
                ;;
              helm-values)
                MSG="chore(gitops): update Helm value ${{ inputs.helm-key }} to ${{ inputs.helm-value }}"
                ;;
              kustomize)
                MSG="chore(gitops): update Kustomize image ${{ inputs.image-name }} to ${{ inputs.image-tag }}"
                ;;
              *)
                MSG="chore(gitops): update manifests in ${{ inputs.manifest-path }}"
                ;;
            esac
          fi

          echo "message=$MSG" >> $GITHUB_OUTPUT
          echo "Commit message: $MSG"

      - name: Commit changes
        if: steps.count-changes.outputs.count > 0
        run: |
          git add ${{ inputs.manifest-path }}
          git commit -m "${{ steps.commit-msg.outputs.message }}

          Updated by: ${{ github.workflow }} #${{ github.run_number }}
          Triggered by: @${{ github.actor }}
          Commit: ${{ github.sha }}

          🤖 Automated GitOps update"

      - name: Push changes directly
        if: steps.count-changes.outputs.count > 0 && !inputs.create-pr
        run: |
          echo "Pushing changes to ${{ inputs.target-branch }}..."
          git push origin HEAD:${{ inputs.target-branch }}

      - name: Push PR branch
        if: steps.count-changes.outputs.count > 0 && inputs.create-pr
        run: |
          echo "Pushing changes to ${{ inputs.pr-branch }}..."
          git push origin ${{ inputs.pr-branch }} --force

      - name: Create Pull Request
        if: steps.count-changes.outputs.count > 0 && inputs.create-pr
        id: create-pr
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '${{ steps.commit-msg.outputs.message }}',
              head: '${{ inputs.pr-branch }}',
              base: '${{ inputs.target-branch }}',
              body: `## 🔄 GitOps Manifest Update

            **Update Type:** \`${{ inputs.update-type }}\`
            **Manifest Path:** \`${{ inputs.manifest-path }}\`
            **Files Changed:** ${{ steps.count-changes.outputs.count }}

            ### Changes

            ${{ inputs.update-type == 'image' && format('- **Image:** `{0}`', inputs.image-name) || '' }}
            ${{ inputs.update-type == 'image' && format('- **New Tag:** `{0}`', inputs.image-tag) || '' }}
            ${{ inputs.update-type == 'helm-values' && format('- **Helm Key:** `{0}`', inputs.helm-key) || '' }}
            ${{ inputs.update-type == 'helm-values' && format('- **New Value:** `{0}`', inputs.helm-value) || '' }}

            ---

            *Automated update triggered by workflow: ${{ github.workflow }} #${{ github.run_number }}*
            *Triggered by: @${{ github.actor }}*
            *Commit: ${{ github.sha }}*`
            });

            core.setOutput('pr-url', pr.html_url);
            return pr.html_url;

      - name: Generate update summary
        if: always()
        run: |
          {
            echo "## 🔄 GitOps Manifest Update Summary"
            echo ""
            echo "**Manifest Path:** \`${{ inputs.manifest-path }}\`"
            echo "**Update Type:** \`${{ inputs.update-type }}\`"
            echo "**Files Changed:** ${{ steps.count-changes.outputs.count }}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.count-changes.outputs.count }}" -eq 0 ]; then
            echo "ℹ️  **No changes detected** - manifests are already up to date" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ **Update successful**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"

            case "${{ inputs.update-type }}" in
              image)
                echo "- **Image:** \`${{ inputs.image-name }}\`" >> "$GITHUB_STEP_SUMMARY"
                echo "- **New Tag:** \`${{ inputs.image-tag }}\`" >> "$GITHUB_STEP_SUMMARY"
                ;;
              helm-values)
                echo "- **Helm Key:** \`${{ inputs.helm-key }}\`" >> "$GITHUB_STEP_SUMMARY"
                echo "- **New Value:** \`${{ inputs.helm-value }}\`" >> "$GITHUB_STEP_SUMMARY"
                ;;
              kustomize)
                echo "- **Image:** \`${{ inputs.image-name }}\`" >> "$GITHUB_STEP_SUMMARY"
                echo "- **New Tag:** \`${{ inputs.image-tag }}\`" >> "$GITHUB_STEP_SUMMARY"
                ;;
            esac

            if [ "${{ inputs.create-pr }}" == "true" ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "📝 **Pull Request:** ${{ steps.create-pr.outputs.pr-url }}" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "✅ **Changes pushed directly to \`${{ inputs.target-branch }}\`**" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
