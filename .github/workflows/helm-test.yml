name: 'Helm Unit Test'

on:
  workflow_call:
    inputs:
      chart-path:
        description: 'Path to Helm chart directory'
        required: true
        type: string
      test-pattern:
        description: 'Test file pattern (glob)'
        required: false
        type: string
        default: 'tests/*.yaml'
      fail-fast:
        description: 'Stop testing on first failure'
        required: false
        type: boolean
        default: false
      parallel:
        description: 'Run tests in parallel'
        required: false
        type: boolean
        default: true
      output-format:
        description: 'Test output format (normal, junit, nunit)'
        required: false
        type: string
        default: 'junit'
      strict:
        description: 'Fail on warnings'
        required: false
        type: boolean
        default: true
      update-snapshots:
        description: 'Update test snapshots'
        required: false
        type: boolean
        default: false
    outputs:
      test-result:
        description: 'Test result (success/failure)'
        value: ${{ jobs.test.outputs.result }}
      tests-run:
        description: 'Number of tests executed'
        value: ${{ jobs.test.outputs.tests-run }}
      tests-passed:
        description: 'Number of tests passed'
        value: ${{ jobs.test.outputs.tests-passed }}
      tests-failed:
        description: 'Number of tests failed'
        value: ${{ jobs.test.outputs.tests-failed }}

permissions:
  contents: read
  checks: write

jobs:
  test:
    name: Helm Unit Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      result: ${{ steps.test.outcome }}
      tests-run: ${{ steps.parse-results.outputs.tests-run }}
      tests-passed: ${{ steps.parse-results.outputs.tests-passed }}
      tests-failed: ${{ steps.parse-results.outputs.tests-failed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Helm
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
        with:
          version: v3.16.3

      - name: Install yq
        run: |
          YQ_VERSION="v4.44.6"
          wget -q "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" -O /tmp/yq
          sudo mv /tmp/yq /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Install helm unittest plugin
        run: |
          PLUGIN_VERSION="v0.6.5"
          helm plugin install https://github.com/helm-unittest/helm-unittest --version ${PLUGIN_VERSION}
          helm unittest --help

      - name: Get chart information
        id: chart-info
        working-directory: ${{ inputs.chart-path }}
        run: |
          CHART_NAME=$(yq eval '.name' Chart.yaml)
          CHART_VERSION=$(yq eval '.version' Chart.yaml)
          echo "name=$CHART_NAME" >> $GITHUB_OUTPUT
          echo "version=$CHART_VERSION" >> $GITHUB_OUTPUT
          echo "Testing chart: $CHART_NAME v$CHART_VERSION"

      - name: Add Helm repositories
        working-directory: ${{ inputs.chart-path }}
        run: |
          if [ -f "Chart.yaml" ]; then
            yq eval '.dependencies[].repository' Chart.yaml | grep -v "^null$" | while read -r repo; do
              if [[ "$repo" == http* ]]; then
                repo_name=$(echo "$repo" | sed 's|https://||;s|http://||;s|/|-|g')
                echo "Adding repository: $repo_name ($repo)"
                helm repo add "$repo_name" "$repo" || true
              fi
            done
          fi
          helm repo update || true

      - name: Update chart dependencies
        working-directory: ${{ inputs.chart-path }}
        run: |
          if [ -f "Chart.yaml" ] && yq eval '.dependencies' Chart.yaml | grep -q "name:"; then
            echo "Updating chart dependencies..."
            helm dependency update
          fi

      - name: Check for test files
        id: check-tests
        working-directory: ${{ inputs.chart-path }}
        run: |
          if [ -d "tests" ] && compgen -G "${{ inputs.test-pattern }}" > /dev/null; then
            TEST_COUNT=$(ls -1 ${{ inputs.test-pattern }} 2>/dev/null | wc -l)
            echo "found=true" >> $GITHUB_OUTPUT
            echo "count=$TEST_COUNT" >> $GITHUB_OUTPUT
            echo "✅ Found $TEST_COUNT test file(s)"
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "count=0" >> $GITHUB_OUTPUT
            echo "⚠️  No test files found matching pattern: ${{ inputs.test-pattern }}"
          fi

      - name: Run helm unittest
        if: steps.check-tests.outputs.found == 'true'
        id: test
        working-directory: ${{ inputs.chart-path }}
        run: |
          echo "Running helm unittest..."

          # Build test command
          TEST_CMD="helm unittest . "

          # Add output format
          if [ "${{ inputs.output-format }}" == "junit" ]; then
            TEST_CMD="$TEST_CMD --output-type junit --output-file test-results.xml"
          elif [ "${{ inputs.output-format }}" == "nunit" ]; then
            TEST_CMD="$TEST_CMD --output-type nunit --output-file test-results.xml"
          fi

          # Add fail-fast flag
          if [ "${{ inputs.fail-fast }}" == "true" ]; then
            TEST_CMD="$TEST_CMD --fail-fast"
          fi

          # Add strict flag
          if [ "${{ inputs.strict }}" == "true" ]; then
            TEST_CMD="$TEST_CMD --strict"
          fi

          # Add update snapshots flag
          if [ "${{ inputs.update-snapshots }}" == "true" ]; then
            TEST_CMD="$TEST_CMD --update-snapshot"
          fi

          # Execute tests
          echo "Command: $TEST_CMD"
          $TEST_CMD | tee test-output.log

      - name: Parse test results
        if: always() && steps.check-tests.outputs.found == 'true'
        id: parse-results
        working-directory: ${{ inputs.chart-path }}
        run: |
          if [ -f "test-results.xml" ]; then
            # Parse JUnit/NUnit XML results
            TESTS_RUN=$(grep -oP '(?<=tests=")[^"]*' test-results.xml | head -1 || echo "0")
            TESTS_FAILED=$(grep -oP '(?<=failures=")[^"]*' test-results.xml | head -1 || echo "0")
            TESTS_PASSED=$((TESTS_RUN - TESTS_FAILED))
          elif [ -f "test-output.log" ]; then
            # Parse plain text output
            TESTS_RUN=$(grep -oP '\d+(?= tests?)' test-output.log | tail -1 || echo "0")
            TESTS_FAILED=$(grep -oP '\d+(?= failed)' test-output.log | tail -1 || echo "0")
            TESTS_PASSED=$((TESTS_RUN - TESTS_FAILED))
          else
            TESTS_RUN="0"
            TESTS_FAILED="0"
            TESTS_PASSED="0"
          fi

          echo "tests-run=$TESTS_RUN" >> $GITHUB_OUTPUT
          echo "tests-failed=$TESTS_FAILED" >> $GITHUB_OUTPUT
          echo "tests-passed=$TESTS_PASSED" >> $GITHUB_OUTPUT

          echo "Tests run: $TESTS_RUN"
          echo "Tests passed: $TESTS_PASSED"
          echo "Tests failed: $TESTS_FAILED"

      - name: Upload test results
        if: always() && steps.check-tests.outputs.found == 'true'
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: helm-unittest-results
          path: |
            ${{ inputs.chart-path }}/test-results.xml
            ${{ inputs.chart-path }}/test-output.log
          retention-days: 30

      - name: Publish test results
        if: always() && steps.check-tests.outputs.found == 'true' && inputs.output-format == 'junit'
        uses: EnricoMi/publish-unit-test-result-action@567cc7f8dcea3eba5da355f6ebc95663310d8a07 # v2.18.0
        with:
          files: ${{ inputs.chart-path }}/test-results.xml
          check_name: Helm Unit Test Results

      - name: Generate test summary
        if: always()
        working-directory: ${{ inputs.chart-path }}
        run: |
          echo "## 🧪 Helm Unit Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Chart:** \`${{ steps.chart-info.outputs.name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ steps.chart-info.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Test Pattern:** \`${{ inputs.test-pattern }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.check-tests.outputs.found }}" == "false" ]; then
            echo "⚠️  **No test files found**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Create test files in \`tests/\` directory to enable testing." >> $GITHUB_STEP_SUMMARY
          else
            echo "### Test Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Total Tests | ${{ steps.parse-results.outputs.tests-run }} |" >> $GITHUB_STEP_SUMMARY
            echo "| ✅ Passed | ${{ steps.parse-results.outputs.tests-passed }} |" >> $GITHUB_STEP_SUMMARY
            echo "| ❌ Failed | ${{ steps.parse-results.outputs.tests-failed }} |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            if [ "${{ steps.test.outcome }}" == "success" ]; then
              echo "✅ **All tests passed!**" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ **Some tests failed. Review the test output above.**" >> $GITHUB_STEP_SUMMARY
            fi
          fi
