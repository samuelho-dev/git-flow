name: 'Docker Build, Scan, Sign & Push'

on:
  workflow_call:
    inputs:
      context:
        description: 'Build context path'
        required: false
        type: string
        default: '.'
      dockerfile:
        description: 'Path to Dockerfile'
        required: false
        type: string
        default: './Dockerfile'
      image:
        description: 'Image name (without registry/tag)'
        required: true
        type: string
      registry:
        description: 'Container registry URL'
        required: false
        type: string
        default: 'ghcr.io'
      platforms:
        description: 'Target platforms (comma-separated)'
        required: false
        type: string
        default: 'linux/amd64'
      push:
        description: 'Push image to registry'
        required: false
        type: boolean
        default: true
      scan:
        description: 'Run Trivy vulnerability scan'
        required: false
        type: boolean
        default: true
      sign:
        description: 'Sign image with Cosign (keyless OIDC)'
        required: false
        type: boolean
        default: true
      sbom:
        description: 'Generate SBOM (Software Bill of Materials)'
        required: false
        type: boolean
        default: true
      cache-registry:
        description: 'Use registry cache for faster builds'
        required: false
        type: boolean
        default: true
      build-args:
        description: 'Build arguments (KEY=VALUE, one per line)'
        required: false
        type: string
        default: ''
      severity:
        description: 'Minimum vulnerability severity to report'
        required: false
        type: string
        default: 'HIGH,CRITICAL'
      upload-sarif:
        description: 'Upload SARIF to GitHub Security (requires Code Scanning enabled)'
        required: false
        type: boolean
        default: false
      runs-on:
        description: 'Runner label to execute the job on'
        required: false
        type: string
        default: 'homelab-runners'
      cosign-identity-regexp:
        description: 'Cosign certificate identity regexp for verification. Defaults to this (git-flow) reusable workflow repo, since the OIDC identity of a reusable workflow is its own path, not the caller. Override when forking git-flow under another org.'
        required: false
        type: string
        default: 'https://github.com/samuelho-dev/git-flow/.github/workflows/.*'
    secrets:
      registry-username:
        description: 'Registry username'
        required: false
      registry-password:
        description: 'Registry password/token'
        required: false
    outputs:
      digest:
        description: 'Image digest (sha256:...)'
        value: ${{ jobs.build.outputs.digest }}
      tags:
        description: 'Image tags (newline-separated)'
        value: ${{ jobs.build.outputs.tags }}
      sbom-path:
        description: 'Path to SBOM artifact'
        value: ${{ jobs.build.outputs.sbom-path }}

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write
  actions: write  # Required for artifact upload in SBOM generation

jobs:
  build:
    name: Build & Push Docker Image
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
      sbom-path: ${{ steps.sbom.outputs.path }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Log in to container registry
        if: inputs.push
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.registry-username || github.actor }}
          password: ${{ secrets.registry-password || secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ inputs.registry }}/${{ github.repository_owner }}/${{ inputs.image }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=${{ inputs.image }}
            org.opencontainers.image.description=Built from ${{ github.repository }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}

      - name: Parse build arguments
        id: build-args
        if: inputs.build-args != ''
        shell: bash
        run: |
          {
            echo "args<<EOF"
            echo "${{ inputs.build-args }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.build-args.outputs.args }}
          cache-from: ${{ inputs.cache-registry && format('type=registry,ref={0}/{1}/{2}:buildcache', inputs.registry, github.repository_owner, inputs.image) || 'type=gha' }}
          # mode=min: export only the final image's layers. mode=max re-packs and
          # writes every intermediate stage (the fat builder node_modules / nx build
          # layers), which on ghcr took ~6min to prepare + minutes-per-layer to write,
          # blowing past timeout-minutes. ignore-error keeps a slow/failed cache export
          # from ever failing the build+push itself.
          cache-to: ${{ inputs.cache-registry && format('type=registry,ref={0}/{1}/{2}:buildcache,mode=min,ignore-error=true', inputs.registry, github.repository_owner, inputs.image) || 'type=gha,mode=min,ignore-error=true' }}
          provenance: true
          sbom: false

      - name: Run Trivy vulnerability scanner (table output)
        if: inputs.scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ inputs.registry }}/${{ github.repository_owner }}/${{ inputs.image }}@${{ steps.build.outputs.digest }}
          format: 'table'
          severity: ${{ inputs.severity }}
          timeout: '10m'
          exit-code: '0' # Don't fail on vulnerabilities, just report
          version: 'v0.69.3'

      - name: Run Trivy vulnerability scanner (SARIF output)
        if: inputs.scan && inputs.upload-sarif
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ inputs.registry }}/${{ github.repository_owner }}/${{ inputs.image }}@${{ steps.build.outputs.digest }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: ${{ inputs.severity }}
          timeout: '10m'
          version: 'v0.69.3'

      - name: Upload Trivy scan results to GitHub Security
        if: inputs.scan && inputs.upload-sarif
        uses: github/codeql-action/upload-sarif@1a818fd5f97ed0ee9a823421bd5b171add01227f # v4.36.2
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'container-scan'

      - name: Generate SBOM
        if: inputs.sbom
        id: sbom
        uses: anchore/sbom-action@7ccf588e3cf3cc2611714c2eeae48550fbc17552 # v0.17.10
        with:
          image: ${{ inputs.registry }}/${{ github.repository_owner }}/${{ inputs.image }}@${{ steps.build.outputs.digest }}
          format: 'spdx-json'
          output-file: 'sbom.spdx.json'
          upload-artifact: false  # Disabled: reusable workflow artifact upload has issues
          upload-release-assets: false

      - name: Upload SBOM as artifact
        if: inputs.sbom
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ inputs.image }}
          path: sbom.spdx.json
          retention-days: 30

      - name: Install Cosign
        if: inputs.sign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with Cosign (keyless OIDC)
        if: inputs.sign && inputs.push
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          cosign sign --yes \
            ${{ inputs.registry }}/${{ github.repository_owner }}/${{ inputs.image }}@${{ steps.build.outputs.digest }}

      - name: Verify signature
        if: inputs.sign && inputs.push
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          # For reusable workflows, the signature identity is the workflow file path
          # not the calling repository, so we use a pattern matching either
          cosign verify \
            --certificate-identity-regexp="${{ inputs.cosign-identity-regexp }}" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            ${{ inputs.registry }}/${{ github.repository_owner }}/${{ inputs.image }}@${{ steps.build.outputs.digest }}

      - name: Generate build summary
        shell: bash
        run: |
          {
            echo "## 🐳 Docker Build Summary"
            echo ""
            echo "**Image:** \`${{ inputs.registry }}/${{ github.repository_owner }}/${{ inputs.image }}\`"
            echo "**Digest:** \`${{ steps.build.outputs.digest }}\`"
            echo "**Platforms:** \`${{ inputs.platforms }}\`"
            echo ""
            echo "### Tags"
            echo "\`\`\`"
            echo "${{ steps.meta.outputs.tags }}"
            echo "\`\`\`"
            echo ""
            echo "### Security"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ inputs.scan }}" = "true" ]; then
            echo "✅ Vulnerability scan: Completed" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ inputs.sign }}" = "true" ]; then
            echo "✅ Image signature: Verified" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ inputs.sbom }}" = "true" ]; then
            echo "✅ SBOM: Generated" >> "$GITHUB_STEP_SUMMARY"
          fi
