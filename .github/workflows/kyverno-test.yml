name: 'Kyverno Policy Test'

on:
  workflow_call:
    inputs:
      policy-path:
        description: 'Path to Kyverno policies directory'
        required: true
        type: string
      test-path:
        description: 'Path to Chainsaw tests directory'
        required: false
        type: string
        default: 'tests'
      kyverno-version:
        description: 'Kyverno CLI version'
        required: false
        type: string
        default: 'v1.13.0'
      chainsaw-version:
        description: 'Chainsaw version'
        required: false
        type: string
        default: 'v0.2.14'
      test-framework:
        description: 'Test framework (chainsaw, kyverno-cli, both)'
        required: false
        type: string
        default: 'both'
      fail-fast:
        description: 'Stop testing on first failure'
        required: false
        type: boolean
        default: false
      report-format:
        description: 'Report format (json, junit, none)'
        required: false
        type: string
        default: 'junit'
      validate-policies:
        description: 'Validate policy syntax before testing'
        required: false
        type: boolean
        default: true
    outputs:
      test-result:
        description: 'Test result (success/failure)'
        value: ${{ jobs.test.outputs.result }}
      tests-run:
        description: 'Number of tests executed'
        value: ${{ jobs.test.outputs.tests-run }}
      tests-passed:
        description: 'Number of tests passed'
        value: ${{ jobs.test.outputs.tests-passed }}
      tests-failed:
        description: 'Number of tests failed'
        value: ${{ jobs.test.outputs.tests-failed }}

permissions:
  contents: read
  checks: write

jobs:
  test:
    name: Kyverno Policy Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      result: ${{ steps.test-kyverno.outcome == 'success' && steps.test-chainsaw.outcome == 'success' && 'success' || 'failure' }}
      tests-run: ${{ steps.parse-results.outputs.tests-run }}
      tests-passed: ${{ steps.parse-results.outputs.tests-passed }}
      tests-failed: ${{ steps.parse-results.outputs.tests-failed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Kyverno CLI
        run: |
          KYVERNO_VERSION="${{ inputs.kyverno-version }}"
          echo "Installing Kyverno CLI $KYVERNO_VERSION..."
          wget -q "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz"
          tar -xzf "kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz"
          sudo mv kyverno /usr/local/bin/
          kyverno version

      - name: Install Chainsaw
        if: inputs.test-framework == 'chainsaw' || inputs.test-framework == 'both'
        run: |
          CHAINSAW_VERSION="${{ inputs.chainsaw-version }}"
          echo "Installing Chainsaw $CHAINSAW_VERSION..."
          wget -q "https://github.com/kyverno/chainsaw/releases/download/${CHAINSAW_VERSION}/chainsaw_linux_amd64.tar.gz"
          tar -xzf chainsaw_linux_amd64.tar.gz
          sudo mv chainsaw /usr/local/bin/
          chainsaw version

      - name: Install yq
        run: |
          YQ_VERSION="v4.44.6"
          wget -q "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" -O /tmp/yq
          sudo mv /tmp/yq /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Count policies
        id: count-policies
        working-directory: ${{ inputs.policy-path }}
        run: |
          POLICY_COUNT=$(find . -name "*.yaml" -o -name "*.yml" | wc -l)
          echo "count=$POLICY_COUNT" >> $GITHUB_OUTPUT
          echo "Found $POLICY_COUNT policy files"

      - name: Validate policy syntax
        if: inputs.validate-policies
        working-directory: ${{ inputs.policy-path }}
        run: |
          echo "Validating Kyverno policy syntax..."
          INVALID_COUNT=0

          find . -name "*.yaml" -o -name "*.yml" | while read -r policy; do
            echo "Validating: $policy"
            if ! kyverno validate "$policy" > /dev/null 2>&1; then
              echo "❌ Invalid policy: $policy"
              INVALID_COUNT=$((INVALID_COUNT + 1))
            fi
          done

          if [ $INVALID_COUNT -gt 0 ]; then
            echo "❌ Found $INVALID_COUNT invalid policies"
            exit 1
          fi

          echo "✅ All policies are valid"

      - name: Check for Kyverno CLI tests
        id: check-kyverno-tests
        working-directory: ${{ inputs.policy-path }}
        run: |
          if compgen -G "**/kyverno-test.yaml" > /dev/null || compgen -G "**/test-*.yaml" > /dev/null; then
            TEST_COUNT=$(find . -name "kyverno-test.yaml" -o -name "test-*.yaml" | wc -l)
            echo "found=true" >> $GITHUB_OUTPUT
            echo "count=$TEST_COUNT" >> $GITHUB_OUTPUT
            echo "✅ Found $TEST_COUNT Kyverno CLI test files"
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "count=0" >> $GITHUB_OUTPUT
            echo "ℹ️  No Kyverno CLI test files found"
          fi

      - name: Run Kyverno CLI tests
        if: (inputs.test-framework == 'kyverno-cli' || inputs.test-framework == 'both') && steps.check-kyverno-tests.outputs.found == 'true'
        id: test-kyverno
        working-directory: ${{ inputs.policy-path }}
        continue-on-error: ${{ !inputs.fail-fast }}
        run: |
          echo "Running Kyverno CLI tests..."
          kyverno test . \
            --values-file values.yaml \
            --detailed-results \
            ${{ inputs.fail-fast && '--fail-only' || '' }} \
            | tee /tmp/kyverno-test-output.log

      - name: Check for Chainsaw tests
        id: check-chainsaw-tests
        run: |
          if [ -d "${{ inputs.test-path }}" ] && [ "$(find ${{ inputs.test-path }} -name "*.yaml" -o -name "*.yml" | wc -l)" -gt 0 ]; then
            TEST_COUNT=$(find ${{ inputs.test-path }} -name "chainsaw-test.yaml" | wc -l)
            echo "found=true" >> $GITHUB_OUTPUT
            echo "count=$TEST_COUNT" >> $GITHUB_OUTPUT
            echo "✅ Found Chainsaw tests in ${{ inputs.test-path }}"
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "count=0" >> $GITHUB_OUTPUT
            echo "ℹ️  No Chainsaw tests found in ${{ inputs.test-path }}"
          fi

      - name: Run Chainsaw tests
        if: (inputs.test-framework == 'chainsaw' || inputs.test-framework == 'both') && steps.check-chainsaw-tests.outputs.found == 'true'
        id: test-chainsaw
        continue-on-error: ${{ !inputs.fail-fast }}
        run: |
          echo "Running Chainsaw tests..."

          CHAINSAW_CMD="chainsaw test ${{ inputs.test-path }}"

          # Add report format
          if [ "${{ inputs.report-format }}" == "junit" ]; then
            CHAINSAW_CMD="$CHAINSAW_CMD --report-format junit --report-path chainsaw-junit-report.xml"
          elif [ "${{ inputs.report-format }}" == "json" ]; then
            CHAINSAW_CMD="$CHAINSAW_CMD --report-format json --report-path chainsaw-report.json"
          fi

          # Add fail-fast flag
          if [ "${{ inputs.fail-fast }}" == "true" ]; then
            CHAINSAW_CMD="$CHAINSAW_CMD --fail-fast"
          fi

          echo "Command: $CHAINSAW_CMD"
          $CHAINSAW_CMD | tee /tmp/chainsaw-test-output.log

      - name: Parse test results
        if: always()
        id: parse-results
        run: |
          TOTAL_RUN=0
          TOTAL_PASSED=0
          TOTAL_FAILED=0

          # Parse Kyverno CLI results
          if [ -f "/tmp/kyverno-test-output.log" ]; then
            KYVERNO_PASSED=$(grep -oP 'Passed:\s+\K\d+' /tmp/kyverno-test-output.log | tail -1 || echo "0")
            KYVERNO_FAILED=$(grep -oP 'Failed:\s+\K\d+' /tmp/kyverno-test-output.log | tail -1 || echo "0")
            KYVERNO_RUN=$((KYVERNO_PASSED + KYVERNO_FAILED))

            echo "Kyverno CLI: $KYVERNO_RUN tests ($KYVERNO_PASSED passed, $KYVERNO_FAILED failed)"

            TOTAL_RUN=$((TOTAL_RUN + KYVERNO_RUN))
            TOTAL_PASSED=$((TOTAL_PASSED + KYVERNO_PASSED))
            TOTAL_FAILED=$((TOTAL_FAILED + KYVERNO_FAILED))
          fi

          # Parse Chainsaw results
          if [ -f "chainsaw-junit-report.xml" ]; then
            CHAINSAW_RUN=$(grep -oP '(?<=tests=")[^"]*' chainsaw-junit-report.xml | head -1 || echo "0")
            CHAINSAW_FAILED=$(grep -oP '(?<=failures=")[^"]*' chainsaw-junit-report.xml | head -1 || echo "0")
            CHAINSAW_PASSED=$((CHAINSAW_RUN - CHAINSAW_FAILED))

            echo "Chainsaw: $CHAINSAW_RUN tests ($CHAINSAW_PASSED passed, $CHAINSAW_FAILED failed)"

            TOTAL_RUN=$((TOTAL_RUN + CHAINSAW_RUN))
            TOTAL_PASSED=$((TOTAL_PASSED + CHAINSAW_PASSED))
            TOTAL_FAILED=$((TOTAL_FAILED + CHAINSAW_FAILED))
          elif [ -f "/tmp/chainsaw-test-output.log" ]; then
            # Parse plain text output
            CHAINSAW_PASSED=$(grep -c "PASS" /tmp/chainsaw-test-output.log || echo "0")
            CHAINSAW_FAILED=$(grep -c "FAIL" /tmp/chainsaw-test-output.log || echo "0")
            CHAINSAW_RUN=$((CHAINSAW_PASSED + CHAINSAW_FAILED))

            echo "Chainsaw: $CHAINSAW_RUN tests ($CHAINSAW_PASSED passed, $CHAINSAW_FAILED failed)"

            TOTAL_RUN=$((TOTAL_RUN + CHAINSAW_RUN))
            TOTAL_PASSED=$((TOTAL_PASSED + CHAINSAW_PASSED))
            TOTAL_FAILED=$((TOTAL_FAILED + CHAINSAW_FAILED))
          fi

          echo "tests-run=$TOTAL_RUN" >> $GITHUB_OUTPUT
          echo "tests-passed=$TOTAL_PASSED" >> $GITHUB_OUTPUT
          echo "tests-failed=$TOTAL_FAILED" >> $GITHUB_OUTPUT

          echo ""
          echo "Total: $TOTAL_RUN tests ($TOTAL_PASSED passed, $TOTAL_FAILED failed)"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: kyverno-test-results
          path: |
            /tmp/kyverno-test-output.log
            /tmp/chainsaw-test-output.log
            chainsaw-junit-report.xml
            chainsaw-report.json
          retention-days: 30

      - name: Publish Chainsaw test results
        if: always() && inputs.report-format == 'junit' && steps.check-chainsaw-tests.outputs.found == 'true'
        uses: EnricoMi/publish-unit-test-result-action@567cc7f8dcea3eba5da355f6ebc95663310d8a07 # v2.18.0
        with:
          files: chainsaw-junit-report.xml
          check_name: Kyverno Chainsaw Test Results

      - name: Generate test summary
        if: always()
        run: |
          {
            echo "## 🔒 Kyverno Policy Test Summary"
            echo ""
            echo "**Policy Path:** \`${{ inputs.policy-path }}\`"
            echo "**Test Framework:** \`${{ inputs.test-framework }}\`"
            echo "**Policies Found:** ${{ steps.count-policies.outputs.count }}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ inputs.validate-policies }}" == "true" ]; then
            echo "✅ **All policies passed syntax validation**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi

          NO_TESTS=true

          if [ "${{ steps.check-kyverno-tests.outputs.found }}" == "true" ] || [ "${{ steps.check-chainsaw-tests.outputs.found }}" == "true" ]; then
            NO_TESTS=false
            echo "### Test Results" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Metric | Count |" >> "$GITHUB_STEP_SUMMARY"
            echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
            echo "| Total Tests | ${{ steps.parse-results.outputs.tests-run }} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| ✅ Passed | ${{ steps.parse-results.outputs.tests-passed }} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| ❌ Failed | ${{ steps.parse-results.outputs.tests-failed }} |" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"

            if [ "${{ steps.check-kyverno-tests.outputs.found }}" == "true" ]; then
              echo "- **Kyverno CLI Tests:** ${{ steps.check-kyverno-tests.outputs.count }} files" >> "$GITHUB_STEP_SUMMARY"
            fi

            if [ "${{ steps.check-chainsaw-tests.outputs.found }}" == "true" ]; then
              echo "- **Chainsaw Tests:** Found in \`${{ inputs.test-path }}\`" >> "$GITHUB_STEP_SUMMARY"
            fi

            echo "" >> "$GITHUB_STEP_SUMMARY"

            if [ "${{ steps.parse-results.outputs.tests-failed }}" == "0" ]; then
              echo "✅ **All tests passed!**" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "❌ **Some tests failed. Review the test output above.**" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          if [ "$NO_TESTS" == "true" ]; then
            {
              echo "⚠️  **No test files found**"
              echo ""
              echo "To enable testing, create:"
              echo "- Kyverno CLI tests: \`kyverno-test.yaml\` or \`test-*.yaml\` in policy directory"
              echo "- Chainsaw tests: test manifests in \`${{ inputs.test-path }}/\` directory"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
