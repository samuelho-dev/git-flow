name: Test Composite Actions Locally

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  test-setup-node-pnpm:
    name: Test setup-node-pnpm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test setup-node-pnpm action
        uses: ./actions/setup-node-pnpm
        with:
          node-version: 20
          pnpm-version: 8
          cache: true

      - name: Verify Node.js
        run: node --version

      - name: Verify pnpm
        run: pnpm --version

      - name: Test pnpm command
        run: pnpm --version

  test-setup-kubernetes-tools:
    name: Test setup-kubernetes-tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test setup-kubernetes-tools action
        uses: ./actions/setup-kubernetes-tools
        with:
          install-kubectl: true
          install-helm: true
          install-argocd: false
          install-cosign: false

      - name: Verify kubectl
        run: kubectl version --client

      - name: Verify Helm
        run: helm version
