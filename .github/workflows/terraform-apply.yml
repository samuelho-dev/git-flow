name: 'Terraform Apply'

# Applies a saved plan produced by terraform-plan. Retrieves the plan from
# GitHub artifacts or an S3-compatible object store, re-inits, and applies it.
# Pair with a GitHub `environment` for required reviewers on production applies.

on:
  workflow_call:
    inputs:
      terraform-path:
        description: 'Directory containing the Terraform configuration'
        required: true
        type: string
      plan-artifact-name:
        description: 'Plan artifact name produced by terraform-plan'
        required: true
        type: string
      plan-storage-endpoint:
        description: 'S3-compatible endpoint for the plan archive; empty uses GitHub artifacts'
        required: false
        type: string
        default: ''
      plan-storage-bucket:
        description: 'Bucket containing the plan archive'
        required: false
        type: string
        default: ''
      plan-storage-key:
        description: 'Attempt-scoped object key containing the plan archive'
        required: false
        type: string
        default: ''
      terraform-version:
        description: 'Terraform version (must match the version that produced the plan)'
        required: false
        type: string
        default: 'latest'
      aws-region:
        description: 'AWS region for provider/backend'
        required: false
        type: string
        default: 'us-west-2'
      environment:
        description: 'GitHub deployment environment for protection rules (optional)'
        required: false
        type: string
        default: ''
      backend-config:
        description: 'Path to a backend config file for `terraform init -backend-config` (relative to terraform-path)'
        required: false
        type: string
        default: ''
      checkout-ref:
        description: 'Git ref to checkout before applying (default: the triggering SHA). Useful when an earlier job commits desired terraform inputs to a branch, then this apply should run against that updated ref.'
        required: false
        type: string
        default: ''
      runs-on:
        description: 'Runner label to execute the job on'
        required: false
        type: string
        default: 'ubuntu-latest'
    secrets:
      aws-role-arn:
        description: 'IAM role ARN to assume via GitHub OIDC'
        required: true
      cloudflare-api-token:
        description: 'Scoped Cloudflare API token (optional; required only when Terraform uses Cloudflare)'
        required: false
      plan-storage-access-key-id:
        description: 'Access key for the S3-compatible plan store'
        required: false
      plan-storage-secret-access-key:
        description: 'Secret key for the S3-compatible plan store'
        required: false
    outputs:
      applied:
        description: 'true when the apply completed successfully'
        value: ${{ jobs.apply.outputs.applied }}

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    name: Terraform Apply
    runs-on: ${{ inputs.runs-on }}
    environment: ${{ inputs.environment }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.terraform-path }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.cloudflare-api-token }}
    outputs:
      applied: ${{ steps.apply.outputs.applied }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ secrets.aws-role-arn }}
          aws-region: ${{ inputs.aws-region }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - name: Download plan artifact
        if: inputs.plan-storage-endpoint == ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.plan-artifact-name }}
          path: ${{ inputs.terraform-path }}

      - name: Download plan from object storage
        if: inputs.plan-storage-endpoint != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.plan-storage-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.plan-storage-secret-access-key }}
          PLAN_ENDPOINT: ${{ inputs.plan-storage-endpoint }}
          PLAN_BUCKET: ${{ inputs.plan-storage-bucket }}
          PLAN_KEY: ${{ inputs.plan-storage-key }}
        run: |
          set -euo pipefail
          : "${AWS_ACCESS_KEY_ID:?missing plan storage access key}"
          : "${AWS_SECRET_ACCESS_KEY:?missing plan storage secret key}"
          : "${PLAN_BUCKET:?missing plan storage bucket}"
          : "${PLAN_KEY:?missing plan storage key}"
          archive="$RUNNER_TEMP/terraform-plan.tar.gz"
          env -u AWS_SESSION_TOKEN aws --endpoint-url "$PLAN_ENDPOINT" --region garage \
            s3 cp "s3://$PLAN_BUCKET/$PLAN_KEY" "$archive" --no-progress
          env -u AWS_SESSION_TOKEN aws --endpoint-url "$PLAN_ENDPOINT" --region garage \
            s3 cp "s3://$PLAN_BUCKET/$PLAN_KEY.sha256" "$archive.sha256" --no-progress
          (cd "$RUNNER_TEMP" && sha256sum --check terraform-plan.tar.gz.sha256)
          tar -xzf "$archive"

      - name: Terraform init
        env:
          BACKEND_CONFIG: ${{ inputs.backend-config }}
        run: |
          set -euo pipefail
          args=(-input=false)
          if [ -n "$BACKEND_CONFIG" ]; then args+=("-backend-config=$BACKEND_CONFIG"); fi
          for attempt in 1 2 3; do
            terraform init "${args[@]}" && exit 0
            echo "::warning::terraform init failed (attempt $attempt/3); retrying"
            sleep $((attempt * 10))
          done
          terraform init "${args[@]}"

      - name: Terraform apply
        id: apply
        run: |
          set -euo pipefail
          terraform apply -input=false -no-color tfplan
          echo "applied=true" >> "$GITHUB_OUTPUT"

      - name: Delete plan from object storage
        if: always() && inputs.plan-storage-endpoint != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.plan-storage-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.plan-storage-secret-access-key }}
          PLAN_ENDPOINT: ${{ inputs.plan-storage-endpoint }}
          PLAN_BUCKET: ${{ inputs.plan-storage-bucket }}
          PLAN_KEY: ${{ inputs.plan-storage-key }}
        run: |
          set -euo pipefail
          env -u AWS_SESSION_TOKEN aws --endpoint-url "$PLAN_ENDPOINT" --region garage \
            s3 rm "s3://$PLAN_BUCKET/$PLAN_KEY" --no-progress
          env -u AWS_SESSION_TOKEN aws --endpoint-url "$PLAN_ENDPOINT" --region garage \
            s3 rm "s3://$PLAN_BUCKET/$PLAN_KEY.sha256" --no-progress

      - name: Summary
        if: always()
        run: |
          {
            echo "## 🌍 Terraform Apply"
            echo ""
            echo "**Path:** \`${{ inputs.terraform-path }}\`"
            echo "**Environment:** \`${{ inputs.environment || 'none' }}\`"
            echo "**Applied:** \`${{ steps.apply.outputs.applied || 'false' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
