name: 'Terraform Apply'

# Applies a saved plan produced by terraform-plan. Downloads the plan artifact,
# re-inits, and applies it. Pair with a GitHub `environment` for required
# reviewers on production applies.

on:
  workflow_call:
    inputs:
      terraform-path:
        description: 'Directory containing the Terraform configuration'
        required: true
        type: string
      plan-artifact-name:
        description: 'Plan artifact name produced by terraform-plan'
        required: true
        type: string
      terraform-version:
        description: 'Terraform version (must match the version that produced the plan)'
        required: false
        type: string
        default: 'latest'
      aws-region:
        description: 'AWS region for provider/backend'
        required: false
        type: string
        default: 'us-west-2'
      environment:
        description: 'GitHub deployment environment for protection rules (optional)'
        required: false
        type: string
        default: ''
      backend-config:
        description: 'Path to a backend config file for `terraform init -backend-config` (relative to terraform-path)'
        required: false
        type: string
        default: ''
      checkout-ref:
        description: 'Git ref to checkout before applying (default: the triggering SHA). Useful when an earlier job commits desired terraform inputs to a branch, then this apply should run against that updated ref.'
        required: false
        type: string
        default: ''
      runs-on:
        description: 'Runner label to execute the job on'
        required: false
        type: string
        default: 'ubuntu-latest'
    secrets:
      aws-role-arn:
        description: 'IAM role ARN to assume via GitHub OIDC'
        required: true
      cloudflare-api-key:
        description: 'Cloudflare Global API Key (optional; required only when the terraform uses the Cloudflare provider)'
        required: false
      cloudflare-email:
        description: 'Cloudflare API Email (optional; required only when the terraform uses the Cloudflare provider)'
        required: false
    outputs:
      applied:
        description: 'true when the apply completed successfully'
        value: ${{ jobs.apply.outputs.applied }}

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    name: Terraform Apply
    runs-on: ${{ inputs.runs-on }}
    environment: ${{ inputs.environment }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.terraform-path }}
    env:
      CLOUDFLARE_API_KEY: ${{ secrets.cloudflare-api-key }}
      CLOUDFLARE_EMAIL: ${{ secrets.cloudflare-email }}
    outputs:
      applied: ${{ steps.apply.outputs.applied }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4 # Renovate pins to SHA
        with:
          role-to-assume: ${{ secrets.aws-role-arn }}
          aws-region: ${{ inputs.aws-region }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3 # Renovate pins to SHA
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - name: Download plan artifact
        uses: actions/download-artifact@v4 # Renovate pins to SHA
        with:
          name: ${{ inputs.plan-artifact-name }}
          path: ${{ inputs.terraform-path }}

      - name: Terraform init
        env:
          BACKEND_CONFIG: ${{ inputs.backend-config }}
        run: |
          set -euo pipefail
          args=(-input=false)
          if [ -n "$BACKEND_CONFIG" ]; then args+=("-backend-config=$BACKEND_CONFIG"); fi
          terraform init "${args[@]}"

      - name: Terraform apply
        id: apply
        run: |
          set -euo pipefail
          terraform apply -input=false -no-color tfplan
          echo "applied=true" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        run: |
          {
            echo "## 🌍 Terraform Apply"
            echo ""
            echo "**Path:** \`${{ inputs.terraform-path }}\`"
            echo "**Environment:** \`${{ inputs.environment || 'none' }}\`"
            echo "**Applied:** \`${{ steps.apply.outputs.applied || 'false' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
